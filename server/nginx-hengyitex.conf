server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hengyitex.top www.hengyitex.top;

    return 301 https://hengyitex.top$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name hengyitex.top;

    ssl_certificate /etc/letsencrypt/live/hengyitex.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hengyitex.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 16m;
    root /var/www/hengyitex;

    location = / {
        return 302 /admin-web/;
    }

    location /admin-web/ {
        try_files $uri $uri/ /admin-web/index.html;
    }

    # Public mini-program sample request submission; other API writes remain protected.
    location = /api/requests {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000/api/requests;
    }

    # Server-to-server material import; ordinary API routes keep the 16MB global limit.
    location = /api/integrations/media-warehouse/imports {
        client_max_body_size 150m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:8000/api/integrations/media-warehouse/imports;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    location /uploads/ {
        alias /var/lib/hengyitex/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /miniprogram/ {
        alias /var/www/hengyitex/miniprogram/;
        expires 7d;
    }
}
